# Self-hosted Dosed EPR: app + PostgreSQL + Caddy (TLS). Run on a server located in
# the EU/EEA (ideally Ireland) with full-disk encryption. See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: epr
      POSTGRES_USER: epr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epr"]
      interval: 10s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EPR_ENV: production
      EPR_DATABASE_URL: postgresql+psycopg://epr:${POSTGRES_PASSWORD}@db:5432/epr
      EPR_HEALTHLINK_INBOUND_DIR: /data/healthlink/in
      EPR_HEALTHLINK_OUTBOUND_DIR: /data/healthlink/out
      EPR_HEALTHLINK_ARCHIVE_DIR: /data/healthlink/archive
    volumes:
      - healthlink:/data/healthlink
    tmpfs:
      - /tmp   # uploads (e.g. scribe audio) are spooled in RAM, never to disk
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, web]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    environment:
      EPR_DOMAIN: ${EPR_DOMAIN:?set EPR_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    networks: [web]

volumes:
  pgdata:
  healthlink:
  caddy_data:

networks:
  internal:
    internal: true   # the database is never reachable from outside
  web:
